<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Запросы оценки</title>
  <style>
    body{font:15px system-ui,sans-serif;margin:0 auto;max-width:1100px;padding:24px;color:#20242a;background:#f6f7f8}
    h1{font-size:24px} #status{color:#667} article{display:grid;grid-template-columns:160px 1fr;gap:16px;
    background:white;border:1px solid #ddd;border-radius:10px;margin:14px 0;padding:16px}
    .photo{border:0;background:none;padding:0;cursor:zoom-in;text-align:left}
    .photo img{width:160px;max-height:240px;object-fit:contain}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;
    background:#f4f5f6;padding:12px;border-radius:6px} summary{cursor:pointer} .meta{line-height:1.7}
    .meta a{color:#176399;overflow-wrap:anywhere}
    dialog{border:0;border-radius:10px;padding:12px;max-width:95vw;max-height:95vh}
    dialog::backdrop{background:rgba(0,0,0,.8)}
    dialog img{display:block;max-width:90vw;max-height:85vh;object-fit:contain}
    .close{display:block;margin:0 0 8px auto}
    @media(max-width:600px){article{grid-template-columns:1fr}.photo img{width:100%;max-height:320px}}
  </style>
</head>
<body>
  <h1>Запросы /v1/eval/predict</h1>
  <button id="refresh" type="button">Обновить</button><p id="status">Загрузка…</p>
  <main id="entries"></main>
  <button id="more" hidden>Показать ещё</button>
  <dialog id="photo-dialog" aria-label="Фотография запроса">
    <button class="close" type="button">Закрыть</button><img alt="Фотография запроса">
  </dialog>
  <script>
    let shown=0;
    const dialog=document.getElementById('photo-dialog');
    dialog.querySelector('.close').onclick=()=>dialog.close();
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
    function openPhoto(url,alt){
      const image=dialog.querySelector('img');image.src=url;image.alt=alt;dialog.showModal();
    }
    async function refresh(more=false){
      const status=document.getElementById('status'), entries=document.getElementById('entries');
      try{
        const response=await fetch(`/v1/eval/logs/data?offset=${more?shown:0}`,{cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const rows=await response.json(); if(!more){entries.replaceChildren();shown=0}
        shown+=rows.length;
        status.textContent=`Показано ${shown} записей`;
        document.getElementById('more').hidden=rows.length<200;
        for(const row of rows){
          const article=document.createElement('article');
          if(row.image_url){
            const button=document.createElement('button'),img=document.createElement('img');
            button.className='photo';button.type='button';button.title='Открыть фото';
            img.src=row.image_url;img.alt=row.filename||'Фото';
            button.onclick=()=>openPhoto(row.image_url,img.alt);
            button.append(img);article.append(button);
          }
          const info=document.createElement('div'), meta=document.createElement('div');meta.className='meta';
          const result=row.response||{};
          const confidence=row.model_confidence_pct??
            (row.model?.probability!=null?Math.round(row.model.probability*1000)/10:null);
          meta.textContent=`${row.requested_at} · ${row.request_id} · HTTP ${row.status_code}\n`+
            `модель: ${(row.model_answered??row.model?.answered)===true?'ответ':
              (row.model_answered??row.model?.answered)===false?'отказ':'не запускалась'} · `+
            `уверенность: ${confidence==null?'—':confidence+'%'} · `+
            `ответ: ${row.response_ms} мс\nslug: `;
          if(result.slug){
            const link=document.createElement('a');
            link.href=`https://vino-svoe.ru/wines/${encodeURIComponent(result.slug)}`;
            link.target='_blank';link.rel='noopener noreferrer';link.textContent=result.slug;
            meta.append(link);
          }else{meta.append('—')}
          meta.append(document.createTextNode('\n'+
            `судья: ${row.judge_called?'да':'нет'} · ${row.judge_ms??'—'} мс · `+
            `фоллбэк после ошибки: ${row.judge_error_fallback?'да':'нет'}`));
          info.append(meta);
          const details=document.createElement('details'), summary=document.createElement('summary');
          summary.textContent='Все данные модели и судьи';
          const pre=document.createElement('pre');pre.textContent=JSON.stringify(row,null,2);
          details.append(summary,pre);info.append(details);article.append(info);entries.append(article);
        }
      }catch(error){status.textContent=`Не удалось загрузить журнал: ${error.message}`}
    }
    document.getElementById('more').onclick=()=>refresh(true);
    document.getElementById('refresh').onclick=()=>refresh();
    refresh();
  </script>
</body>
</html>
