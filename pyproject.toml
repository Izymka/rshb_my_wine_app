[project]
name = "wine-scanner"
version = "0.1.0"
description = "Поиск карточки вина по фотографии этикетки для платформы «Своё Вино»"
requires-python = ">=3.11,<3.13"

# Ядро: всё, что нужно для baseline (эмбеддинг → индекс → поиск).
# Остальное вынесено в опциональные группы ниже и ставится по мере прохождения этапов —
# так неудачная установка тяжёлой библиотеки не блокирует работу над текущим блоком.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pillow-heif>=1.5.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Э3 — детекция и обрезка этикетки.
# Пусто намеренно: обе ступени RT-DETR используют transformers из ядра.
# torchvision остаётся для преобразований изображений и операций над рамками.
# Ultralytics YOLO не используем — AGPL-3.0, для коммерческого применения нужна платная
# лицензия. Подробности и альтернативы в LICENSES.md.

# Э6 — локальный матчинг для ре-ранкинга.
# XFeat (Apache 2.0) подгружается через torch.hub, отдельного пакета не требует.
# kornia нужен для RANSAC и вспомогательных геометрических операций.
rerank = [
    "kornia>=0.7.3",
]

# Э7 — текстовая ветка: распознавание и поиск по названиям
ocr = [
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",  # TF-IDF по символьным n-граммам в текстовом индексе
]

# Э10 — решающий слой и калибровка вероятности
decide = [
    "catboost>=1.2.8",
    "lightgbm>=4.5",  # historical comparison scripts only
    "scikit-learn>=1.5",
]

# Сервис для демо
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
# Инструменты разработки. Отдельно от project.dependencies, потому что в продакшен-образ
# они не нужны — uv ставит их локально и не тянет в сборку.
dev = [
    "alembic>=1.14",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "ruff>=0.6",
    "pytest>=8.3",
    "optuna>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wine_scanner"]

# CUDA wheels on Windows/Linux; other packages continue to use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в пути: пакет wine_scanner ставится в окружение, а api/ — нет, это точка
# входа сервиса, и импортировать её тесты могут только отсюда.
pythonpath = ["."]
