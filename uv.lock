[[package]]
name = "wine-scanner"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "faiss-cpu" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "opencv-python" },
    { name = "pandas" },
    { name = "pillow" },
    { name = "pillow-heif" },
    { name = "psycopg", extra = ["binary"] },
    { name = "sqlalchemy" },
    { name = "torch", version = "2.11.0+cu128", source = { registry = "https://download.pytorch.org/whl/cu128" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torch", version = "2.13.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torchvision", version = "0.26.0+cu128", source = { registry = "https://download.pytorch.org/whl/cu128" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torchvision", version = "0.28.0", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "tqdm" },
    { name = "transformers" },
]

[package.optional-dependencies]
api = [
    { name = "fastapi" },
    { name = "python-multipart" },
    { name = "uvicorn", extra = ["standard"] },
]
decide = [
    { name = "catboost" },
    { name = "lightgbm" },
    { name = "scikit-learn" },
]
ocr = [
    { name = "paddleocr" },
    { name = "paddlepaddle" },
    { name = "rank-bm25" },
    { name = "rapidfuzz" },
    { name = "scikit-learn" },
]
rerank = [
    { name = "kornia" },
]

[package.dev-dependencies]
dev = [
    { name = "alembic" },
    { name = "ipykernel" },
    { name = "jupyterlab" },
    { name = "matplotlib" },
    { name = "optuna" },
    { name = "pytest" },
    { name = "ruff" },
]

