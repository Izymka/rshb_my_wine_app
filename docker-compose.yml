# Запуск сервиса на машине с картой NVIDIA (у нас — RTX 4060 Ti).
#
#   cp .env.example .env            # ключи облачного OCR и VLM-судьи, если используются
#   docker compose up --build
#   curl localhost:8080/health      # проверить, что блоки действительно на GPU
#
# Порт 8080 — тот, что по умолчанию ждёт скрипт оценки организаторов
# (data/eval/participant_test.sh, endpoint http://127.0.0.1:8080/v1/eval/predict).
#
# Первое, что надо посмотреть в /health после переезда, — поле devices. Оно показывает, на чём
# считается каждый блок по отдельности. XFeat должен работать на GPU;
# PaddleOCR в текущем адаптере намеренно работает на CPU.

services:
  scanner:
    build: .
    ports:
      - "8080:8000"
    volumes:
      # Индекс, дескрипторы каталога, детектор этикетки, решающий слой.
      - ./models:/app/models
      # Эталоны каталога — их отдаёт GET /catalog/image/{slug} для интерфейса.
      - ./data/catalog:/app/data/catalog:ro
      - ./data/media:/app/data/media:ro
      # Решения человека по каталогу: дубли с каноническим slug и исключённые карточки
      # (catalog_slug_equivalences.csv, catalog_excluded_slugs.csv). Без них сервис молча
      # отвечает строго: выдаёт дубли вместо канонических slug и не видит исключённых карточек.
      - ./data/splits:/app/data/splits:ro
      # Фото и JSONL запросов оценки переживают пересоздание контейнера.
      - ./data/eval_requests:/app/data/eval_requests
      # Кэш чужих весов переживает пересборку образа.
      - torch-cache:/opt/torch
      - paddle-cache:/root/.paddlex
    environment:
      WINE_EVAL_LOG: ${WINE_EVAL_LOG:-0}
      WINE_EVAL_LOG_DIR: /app/data/eval_requests
      WINE_EVAL_LOG_USER: ${WINE_EVAL_LOG_USER:-}
      WINE_EVAL_LOG_PASSWORD: ${WINE_EVAL_LOG_PASSWORD:-}
      # Каталог 18.10.2026: index_platform_sq_v3 с поправленной вырезкой 12 эталонов
      # (data/catalog/label_overrides.csv, scripts/patch_index_crops.py) и 169 винами сайта,
      # заведёнными scripts/add_site_wines.py, — всего 2272 карточки.
      WINE_INDEX: /app/models/index_platform_sq_v3_site_1810
      # Решающий слой А+Б+Г (19.10): параметры v8 на признаках индекса сайта 18.10 и OCR ниже,
      # с дозаполненными атрибутами карточек, монотонными признаками текста и визуальным отрывом
      # только от соседей, которых текст не опроверг. Тест при пороге 0.4: верных 94 (как v8),
      # ложных приёмов 9 из 102 вместо 14. Нужен код того же коммита: признаки считаются иначе.
      WINE_DECIDER: /app/models/decider_site1810_abd
      # Порог отказа /scan вместо 0.533 из meta.json решающего слоя (см. api/main.py).
      WINE_THRESHOLD: ${WINE_THRESHOLD:-0.4}
      # Локальный PaddleOCR; yandex/hybrid используют его и для облачного отката.
      WINE_OCR: ${WINE_OCR:-paddle}
      # Детектор строк PaddleOCR. PP-OCRv6 medium на тесте 18.10: текст R@5 0.82 → 0.89, верных
      # при пороге 0.4 87 → 89 из 100. Нужен paddleocr 3.7 в образе; веса детектора скачиваются
      # в paddle-cache при первом старте.
      WINE_OCR_DET: ${WINE_OCR_DET:-PP-OCRv6_medium_det}
      # Распознаватель строк: PP-OCRv6 medium, дообученный на русском (vladlinv, Apache 2.0,
      # ONNX, onnxruntime-gpu в /opt/ocr). С решающим слоем v8 на тесте 18.10 верных при пороге
      # 0.4 89 → 94 из 100, ложных приёмов те же 14 из 102; OCR 50 → 100 мс, общее время p50
      # 0.98 → 1.03 с. Пусто — прежний eslav_PP-OCRv5_mobile_rec (тогда и WINE_DECIDER v7).
      WINE_OCR_REC: ${WINE_OCR_REC:-/app/models/ocr_rec/PP-OCRv6_medium_rec_ru}
      # Правило выбора внутри семьи по тексту: выключено, решающий слой v7 выбирает сам.
      WINE_SIBLING: ${WINE_SIBLING:-0}
      YANDEX_OCR_API_KEY: ${YANDEX_OCR_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      # VLM-судья между близнецами одной винодельни: Yandex AI Studio (без VPN) или
      # OpenAI-совместимый чат. Включён только в /v1/eval/predict; в /scan — WINE_VLM_SCAN=1.
      # Без ключа YANDEX_LLM_API_KEY поставьте WINE_VLM=0; ключи — см. .env.example.
      WINE_VLM: ${WINE_VLM:-1}
      WINE_VLM_SCAN: ${WINE_VLM_SCAN:-0}
      WINE_VLM_TIMEOUT: ${WINE_VLM_TIMEOUT:-4}
      # Фолбэк на решающий слой: предел судьи от начала запроса и пауза после сбоев облака.
      WINE_VLM_DEADLINE: ${WINE_VLM_DEADLINE:-7}
      WINE_VLM_COOLDOWN: ${WINE_VLM_COOLDOWN:-60}
      WINE_VLM_MAX_FAILURES: ${WINE_VLM_MAX_FAILURES:-2}
      WINE_VLM_OPTIONS: ${WINE_VLM_OPTIONS:-family}
      WINE_VLM_TRIGGER: ${WINE_VLM_TRIGGER:-family}
      WINE_VLM_VERIFY: ${WINE_VLM_VERIFY:-1}
      WINE_VLM_CHECK: ${WINE_VLM_CHECK:-1}
      WINE_VLM_OCR: ${WINE_VLM_OCR:-off}
      WINE_GRAPE: ${WINE_GRAPE:-0}
      WINE_VLM_PROVIDER: ${WINE_VLM_PROVIDER:-yandex}
      WINE_VLM_FALLBACK: ${WINE_VLM_FALLBACK:-}
      YANDEX_LLM_API_KEY: ${YANDEX_LLM_API_KEY:-}
      YANDEX_VLM_MODEL: ${YANDEX_VLM_MODEL:-qwen3.6-35b-a3b}
      YANDEX_LLM_MODEL: ${YANDEX_LLM_MODEL:-yandexgpt-5-lite}
      YANDEX_LLM_BASE_URL: ${YANDEX_LLM_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      WINE_VLM_BASE_URL: ${WINE_VLM_BASE_URL:-}
      WINE_VLM_MODEL: ${WINE_VLM_MODEL:-}
      WINE_VLM_API_KEY: ${WINE_VLM_API_KEY:-}
      # Народный рейтинг с vino-svoe.ru для карточки /catalog/{slug}.
      WINE_PORTAL: ${WINE_PORTAL:-1}
      # Сомелье: те же провайдеры, свой флаг.
      WINE_SOMMELIER: ${WINE_SOMMELIER:-0}
      WINE_LLM_PROVIDER: ${WINE_LLM_PROVIDER:-yandex}
      WINE_LLM_FALLBACK: ${WINE_LLM_FALLBACK:-}
      WINE_LLM_BASE_URL: ${WINE_LLM_BASE_URL:-}
      WINE_LLM_MODEL: ${WINE_LLM_MODEL:-}
      WINE_LLM_API_KEY: ${WINE_LLM_API_KEY:-}
      # Политика eval-ручки: 0 — всегда лучший кандидат (проверка заказчика — вина каталога,
      # null — ошибка), 1 — честный null на незнакомом вине.
      WINE_EVAL_REFUSE: ${WINE_EVAL_REFUSE:-0}
      # Окно ре-ранкинга: 25, как при сборке признаков решающего слоя.
      WINE_RERANK_CANDIDATES: ${WINE_RERANK_CANDIDATES:-25}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      # Модели поднимаются десятки секунд, и до этого сервис отвечать не обязан.
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Nuxt проксирует /api/* в сервис по внутренней сети compose.
      NUXT_SCANNER_URL: http://scanner:8000
      TG_NOTIFY_TOKEN: ${TG_NOTIFY_TOKEN:-}
      TG_NOTIFY_TARGET: ${TG_NOTIFY_TARGET:-}
      # Аккаунты, облачная полка и отзывы. Схема создаётся при первом запросе к базе.
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-wine}:${POSTGRES_PASSWORD:-wine}@postgres:5432/${POSTGRES_DB:-wine}
      # СМС-провайдер не подключён: код входа показывается на экране. 0 — не отдавать код.
      NUXT_AUTH_DEMO_CODES: ${AUTH_DEMO_CODES:-1}
      # Ускорение таймеров игры «Моя винодельня»; 60 — час роста лозы за минуту.
      NUXT_GAME_SPEED: ${GAME_SPEED:-1}
      # Номер счётчика Яндекс Метрики; пусто — без Метрики.
      NUXT_YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
      # Web Push для напоминаний полки и игровых уведомлений; без ключей пуши недоступны.
      NUXT_SHELF_PUSH_PUBLIC_KEY: ${SHELF_PUSH_PUBLIC_KEY:-}
      NUXT_SHELF_PUSH_PRIVATE_KEY: ${SHELF_PUSH_PRIVATE_KEY:-}
      NUXT_SHELF_PUSH_SUBJECT: ${SHELF_PUSH_SUBJECT:-}
    volumes:
      # Очередь напоминаний полки (файлы) переживает пересборку контейнера.
      - push-data:/app/.data
    depends_on:
      scanner:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Локально базу можно поднять одну, без GPU-сервиса: make db (docker compose up -d postgres).
  # Порт открыт только на 127.0.0.1 — для web, запущенного на хосте (make web-dev).
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wine}
      POSTGRES_DB: ${POSTGRES_DB:-wine}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  push-data:
  postgres-data:
  torch-cache:
  paddle-cache:
